[project]
name = "vocalize"
version = "0.1.0"
description = "Voice commands that press the same media keys as a keyboard"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
    "vosk",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vocalize = "core.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
